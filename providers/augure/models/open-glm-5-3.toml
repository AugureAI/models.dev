# Augure Open (preview): GLM-5.3 open weights hosted in Canada for developer API keys.
# Sources (accessed 2026-10-27): https://augureai.ca/docs/models (256K context, 49,152
# output cap, CAD prices; text only, image and file parts get 400 unsupported_content;
# messages reach the model unchanged; response_format goes to the model's own structured
# decoding; thinking returned as reasoning_content; reasoning_effort accepted, "none"
# served as "low", "no setting shortens the thinking as served today"), and
# https://augureai.ca/docs/changelog (added 2026-10-16). Augure's API has temperature and
# top_p but no top_k.
# Effort: Augure validates reasoning_effort against its own enum (none|minimal|low|medium|high;
# "max" is a 400 on Augure) and forwards the literal, with "none" served as "low". The lab's
# low|high|max set therefore does not apply at this surface; the forwarded values are listed.
# Augure's docs add that, as served today, no setting shortens the thinking.
# Prices: CAD 3.00 in / 7.00 out per 1M tokens, converted to USD at the Bank of Canada
# rate of 1.4038 CAD per USD (2026-10-27), rounded to 2 decimals. Cached input is billed
# at the standard input rate. Preview: no SLA and pricing may change, hence status = beta.
schema = 2
base_model = "zhipuai/glm-5.3"
status = "beta"

[capabilities]
reasoning = { supported = true, effort = ["minimal", "low", "medium", "high"] }
structured_output = true
stream_usage = true
top_k = false

[limit]
context = 262_144
output = 49_152

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 2.14

[cost.text.output]
price = 4.99
